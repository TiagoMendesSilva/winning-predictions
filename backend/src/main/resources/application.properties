spring.application.name=guesses

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/winning_predictions}
spring.datasource.username=${DB_USERNAME:winning_predictions_app}
spring.datasource.password=${DB_PASSWORD:winning_predictions_app}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LOG_LEVEL:TRACE}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:DEBUG}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

logging.level.org.springframework.security:${SECURITY_LOG_LEVEL:DEBUG}

football.api.url=https://v3.football.api-sports.io
football.api.key=${FOOTBAL_API_KEY}

app.predictions.allow-expired=${ALLOW_EXPIRED_PREDICTIONS:true}

